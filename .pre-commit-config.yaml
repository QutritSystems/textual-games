repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: run-tests
        name: Run Python Tests
        entry: ./venv/bin/python
        language: script
        pass_filenames: false
        always_run: true
        entry: bash -c "source venv/bin/activate && python test_core.py && python test_battleship_arena.py && python test_auto_battle_logic.py && python test_number_guessing_ai.py"
